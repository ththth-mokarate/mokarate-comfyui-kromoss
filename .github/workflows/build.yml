name: Build Mokarate Kromoss runtime image
# ComfyUI 0.46.0 + comfyui-api 1.19.2 runtime image for SaladCloud, so the
# Kromoss (MOSS-Image) test can run: MOSS-Image needs ComfyUI >= 0.42.1
# natively and Salad's own newest image is still 0.35.0.
# Runtime-only: no model weights are baked in; the Kromoss files are
# /downloaded into the running container on first start (test step).
# The Dockerfile merges Salad's own Dockerfiles (comfyui.dockerfile +
# api.dockerfile); only the versions changed. A plain docker build+push is
# used (no 10 GB layers, so no crane append). Salad's max container image
# size is 35 GB (compressed) — verified against that in the Verify step.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-kromoss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET: ghcr.io/ththth-mokarate/mokarate-comfyui-kromoss:runtime
      COMFY_VERSION: 0.46.0
      COMFY_TAG_SHA: a277b5bf213e8a44fa34817b7770b54f86ef4cea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk space
        run: |
          set -euo pipefail
          df -h .
          available=$(df -PB1 . | awk 'NR==2 {print $4}')
          if (( available < 40 * 1024 * 1024 * 1024 )); then
            echo "::error::less than 40 GiB free disk, refusing to build"
            exit 1
          fi

      - name: Install crane 0.22.1 (checksum-verified)
        run: |
          set -euo pipefail
          VERSION=v0.22.1
          ARCHIVE=go-containerregistry_Linux_x86_64.tar.gz
          SHA256=0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          URL="https://github.com/google/go-containerregistry/releases/download/${VERSION}"
          cd /tmp
          curl -fsSL --retry 3 -o "$ARCHIVE" "$URL/$ARCHIVE"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar --no-same-owner -xzf "$ARCHIVE" -C /tmp crane
          sudo install -m 755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        # crane reads the same ~/.docker/config.json written by docker login

      - name: Build and push test tag
        run: |
          set -euo pipefail
          echo "TEST_TAG=$TARGET-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          docker build -t "$TARGET-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f Dockerfile .
          docker push "$TARGET-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker images "$TARGET-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Verify test image
        run: |
          set -euo pipefail
          crane config "$TEST_TAG" > target.json
          crane manifest "$TEST_TAG" > manifest.json
          python3 - <<'PY'
          import json
          target = json.load(open("target.json"))
          manifest = json.load(open("manifest.json"))
          labels = target["config"].get("Labels") or {}
          assert labels.get("com.mokarate.comfy-version") == "0.46.0", labels
          assert labels.get("com.mokarate.comfyui-api-version") == "1.19.2", labels
          assert target["config"].get("Cmd") == ["./comfyui-api"], target["config"].get("Cmd")
          assert target["config"].get("WorkingDir") == "/opt/ComfyUI", target["config"].get("WorkingDir")
          assert "MODEL_DIR=/opt/ComfyUI/models" in target["config"].get("Env", [])
          assert target["architecture"] == "amd64" and target["os"] == "linux"
          layers = manifest["layers"]
          total = sum(x["size"] for x in layers) + manifest["config"]["size"]
          print(f"compressed image: {total/1e9:.2f} GB; largest layer: {max(x['size'] for x in layers)/1e9:.2f} GB; layers: {len(layers)}")
          assert all(x["size"] < 10_000_000_000 for x in layers), "GHCR layer size limit exceeded"
          assert total < 35_000_000_000, "Salad image size limit (35 GB compressed) exceeded"
          print("manifest verified: labels, Cmd, WorkingDir, MODEL_DIR, size within limits")
          PY
          crane digest "$TEST_TAG"
          # ComfyUI version + MOSS-Image support, checked from inside the image.
          # NOTE: importing nodes.py needs a GPU: ComfyUI 0.46.0's
          # model_management queries torch.cuda at import time, and the
          # GitHub runner has no NVIDIA driver, so a plain runtime import
          # fails there even though the image is fine. MOSS support is
          # therefore verified statically (AST search for the CLIP type
          # list containing moss_image), with a best-effort --cpu runtime
          # import as extra proof.
          docker run --rm "$TEST_TAG" git -C /opt/ComfyUI describe --tags
          HEAD_SHA=$(docker run --rm "$TEST_TAG" git -C /opt/ComfyUI rev-parse HEAD)
          echo "HEAD commit in image: $HEAD_SHA (expected v0.46.0 tag: $COMFY_TAG_SHA)"
          test "$HEAD_SHA" = "$COMFY_TAG_SHA"
          docker run --rm -i "$TEST_TAG" python - <<'PY'
          import ast, pathlib
          hits = []
          for p in pathlib.Path("/opt/ComfyUI").rglob("*.py"):
              if "custom_nodes" in p.parts:
                  continue
              try:
                  tree = ast.parse(p.read_text())
              except Exception:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.List):
                      vals = [e.value for e in node.elts
                              if isinstance(e, ast.Constant) and isinstance(e.value, str)]
                      if "moss_image" in vals and "stable_diffusion" in vals:
                          hits.append((str(p), vals))
          assert hits, "no CLIP type list containing moss_image found"
          print("moss_image in CLIP type list:", hits)
          PY
          docker run --rm "$TEST_TAG" python -c "import sys; sys.argv.append('--cpu'); from nodes import CLIPLoader; d = CLIPLoader.INPUT_TYPES(); assert 'moss_image' in str(d); print('runtime import: moss_image CLIP type present')" || echo "note: runtime import check unavailable on CPU-only runner; static check above is authoritative"

      - name: Promote test tag to runtime
        run: |
          set -euo pipefail
          EXPECTED=$(crane digest "$TEST_TAG")
          crane copy "$TEST_TAG" "$TARGET"
          ACTUAL=$(crane digest "$TARGET")
          test "$EXPECTED" = "$ACTUAL"
          echo "promoted $TARGET @$ACTUAL"
